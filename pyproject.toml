[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Schema-constrained function calling with the supplied LLM SDK"
requires-python = ">=3.10"
dependencies = [
    "llm-sdk",
    "numpy>=1.26,<2.3",
    "pydantic>=2.10,<3",
]

[tool.uv.sources]
llm-sdk = { path = "llm_sdk" }

[tool.uv]
package = false
constraint-dependencies = ["transformers>=4.51,<5"]

[dependency-groups]
dev = ["flake8>=7,<8", "mypy>=1.15,<2"]

[tool.mypy]
python_version = "3.10"
exclude = ["^llm_sdk/", "^tests/","^moulinette/"]

[[tool.mypy.overrides]]
module = "llm_sdk"
follow_imports = "skip"
